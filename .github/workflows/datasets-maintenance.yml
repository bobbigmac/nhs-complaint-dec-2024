name: Refresh slow datasets

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: datasets-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh slow datasets
        run: bash datasets/run_weekly_maintenance.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- datasets/catchments datasets/raw/cqc datasets/output; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/catchments datasets/raw/cqc datasets/output
          git commit -m "chore(data): refresh slow datasets"

      - name: Push refreshed data
        if: steps.changes.outputs.changed == 'true'
        run: git push

      - name: No-op summary
        if: steps.changes.outputs.changed != 'true'
        run: echo "No dataset changes detected."
